<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="electric-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="electric-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagonal Shield -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#070b14" stroke="url(#electric-grad)" stroke-width="2.5" />
  
  <!-- Outer Glow Arc -->
  <polygon points="32,6 56,19 56,45 32,58 8,45 8,19" fill="none" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />

  <!-- Code Bracket Left: < -->
  <path d="M20 23 L13 32 L20 41" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Code Bracket Right: > -->
  <path d="M44 23 L51 32 L44 41" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Center Thunderbolt ⚡ -->
  <path d="M35 14 L23 32 L31 32 L27 50 L41 29 L32 29 Z" fill="url(#bolt-grad)" filter="url(#electric-glow)" stroke="#FFFFFF" stroke-width="0.5" />
</svg>
