<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="electricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-Voltage Hexagonal Shield Background -->
  <polygon points="32,3 60,17 60,47 32,61 4,47 4,17" fill="#070b14" stroke="url(#electricGrad)" stroke-width="3" />
  
  <!-- Outer Glow Arc -->
  <polygon points="32,6 57,18 57,46 32,58 7,46 7,18" fill="none" stroke="#00F0FF" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Code Bracket Left: < -->
  <path d="M19 22 L11 32 L19 42" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right: > -->
  <path d="M45 22 L53 32 L45 42" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Thunderbolt ⚡ -->
  <path d="M35 12 L21 32 L31 32 L26 52 L43 28 L33 28 Z" fill="url(#boltGrad)" filter="url(#electricGlow)" stroke="#FFFFFF" stroke-width="1" />
</svg>
